<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Flag Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen night stadium; a 16:9 canvas letterboxed in the window, fullscreen pill floating top-right */
:root{
  --night:#08100c; --turf:#2f6e3c; --chalk:#eef3ee; --dim:#8c9a92; --lamp:#ffb547; --rim:#24342b;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);overflow:hidden}
#wrap{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{display:block;max-width:100%;border-radius:10px;background:var(--night);outline:none;touch-action:none}
#fs{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,calc(12px + env(safe-area-inset-right,0px)));font:700 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk);background:rgba(16,22,19,.85);border:1px solid var(--rim);border-radius:999px;padding:9px 14px;cursor:pointer}
#fs:hover{border-color:var(--lamp);color:var(--lamp)}
#fs:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
</style>
<div id="wrap"><canvas id="game" width="1600" height="900" tabindex="0" aria-label="Flag Rush speelveld"></canvas></div>
<button id="fs" type="button">Volledig scherm · F</button>

/* ---------- canvas sizing ---------- */
function fit(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let w=aw,h=w*9/16; if(h>ah){h=ah;w=h*16/9;}
  cv.style.width=Math.max(0,Math.floor(w))+'px'; cv.style.height=Math.max(0,Math.floor(h))+'px';
}
addEventListener('resize',fit); document.addEventListener('fullscreenchange',fit); fit();
function toggleFS(){
  try{
    if(!document.fullscreenElement){const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(()=>toast('Volledig scherm is hier niet beschikbaar')); else if(!p) toast('Volledig scherm is hier niet beschikbaar');}
    else {const p=document.exitFullscreen&&document.exitFullscreen(); if(p&&p.catch)p.catch(()=>{});}
  }catch(e){toast('Volledig scherm is hier niet beschikbaar');}
}
document.getElementById('fs').addEventListener('click',e=>{toggleFS();e.currentTarget.blur();cv.focus();});

});

if(!navigator.getGamepads)I.blocked=true;
function dz(x,y){const m=hyp(x,y); if(m<0.15) return [0,0]; const s=Math.min(1,(m-0.15)/0.85)/m; return [x*s,y*s];}
function pollInput(dt){
  let pads=[]; try{pads=navigator.getGamepads?Array.from(navigator.getGamepads()):[];}catch(e){pads=[];I.blocked=true;}
  let gp=null;
  if(I.padIndex!=null&&pads[I.padIndex]&&pads[I.padIndex].connected) gp=pads[I.padIndex];
  if(!gp) for(const p of pads){ if(p&&p.connected){gp=p;break;} }
  I.connected=!!gp;
  const cur={}; for(const k of BK) cur[k]=!!keys[k];
  if(I.tap){cur.X=true;I.tap=false;}
  let lx=0,ly=0,rx=0,ry=0;
  if(gp){
    let any=false;
    for(const k of BK){const b=gp.buttons[BI[k]]; if(b&&(b.pressed||b.value>0.5)){cur[k]=true;any=true;}}
    [lx,ly]=dz(gp.axes[0]||0,gp.axes[1]||0); [rx,ry]=dz(gp.axes[2]||0,gp.axes[3]||0);
    if(any||hyp(lx,ly)>0.4){I.mode='pad';I.padIndex=gp.index;I.padId=gp.id;}
  }
  if(!lx&&!ly){const dx=(cur.RIGHT?1:0)-(cur.LEFT?1:0),dy=(cur.DOWN?1:0)-(cur.UP?1:0); if(dx||dy){const m=hyp(dx,dy);lx=dx/m;ly=dy/m;}}
  I.lx=lx;I.ly=ly;I.rx=rx;I.ry=ry;
  {const rm=hyp(rx,ry);I.rflick=(rm>0.75&&(I.rPrev||0)<=0.75)?{x:rx/rm,y:ry/rm}:null;I.rPrev=rm;}
  for(const k of BK){
    const was=!!I.held[k]; I.pressed[k]=cur[k]&&!was; I.released[k]=!cur[k]&&was;
    if(cur[k]) I.ht[k]=(was?(I.ht[k]||0):0)+dt; else if(!I.released[k]) I.ht[k]=0;
    I.held[k]=cur[k];
  }
  const nx=((cur.RIGHT?1:0)-(cur.LEFT?1:0))||(lx>0.6?1:lx<-0.6?-1:0);
  const ny=((cur.DOWN?1:0)-(cur.UP?1:0))||(ly>0.6?1:ly<-0.6?-1:0);
  I.navX=0; if(nx!==I.ndx){I.ndx=nx;I.nrx=0.38;I.navX=nx;} else if(nx){I.nrx-=dt;if(I.nrx<=0){I.nrx=0.14;I.navX=nx;}}
  I.navY=0; if(ny!==I.ndy){I.ndy=ny;I.nry=0.38;I.navY=ny;} else if(ny){I.nry-=dt;if(I.nry<=0){I.nry=0.14;I.navY=ny;}}
}
function rumble(ms,strong,weak){

    if(va&&va.playEffect){const p=va.playEffect('dual-rumble',{startDelay:0,duration:ms,strongMagnitude:strong,weakMagnitude:weak}); if(p&&p.catch)p.catch(()=>{});} }catch(e){}
}

/* ---------- camera: top-down or behind the offense (Madden view) ---------- */
const CAM={u:-15,y:12.5,h:8,f:850,hz:215,dir:1};
let BEHIND=false;
function P(u,y,z){
  if(!BEHIND)return {x:sx(u),y:sy(y)-(z||0)*9,s:PPY,d:20};
  const d=(u-CAM.u)*CAM.dir;if(d<1.2)return null;const s=CAM.f/d;
  return {x:W/2+(y-CAM.y)*s*CAM.dir,y:CAM.hz+(CAM.h-(z||0))*s,s,d};
}
function stickW(x,y){return BEHIND?{x:-y*CAM.dir,y:x*CAM.dir}:{x,y};}
function camSetting(){return G.poss===0?G.camOff:G.camDef;}
function behindWanted(){return G.screen==='game'&&camSetting()==='achter'&&['presnap','live','dead','playcall','pat','defcall'].includes(G.phase);}
function updateCam(dt,now){
  let tu,ty=12.5;const live=G.phase==='live'||G.phase==='dead';
  let bu=null,by=null;
  if(live){
    if(B.state==='air'){const f=B.t/B.T;bu=lerp(B.x0,B.x1,f);by=lerp(B.y0,B.y1,f);}
    else if(G.carrier&&G.sub==='run'){bu=G.carrier.x;by=G.carrier.y;}
    else if(B.state==='loose'){bu=B.x1;by=B.y1;}
  }
  if(CAM.dir>0){
    tu=G.los-20;
    if(bu!=null){tu=Math.max(G.los-20,bu-16.5);ty=12.5+(by-12.5)*0.55;}
  } else {
    tu=G.los+27;
    const cd=DEF.find(d=>d.ctrl);
    if(cd&&(live||G.phase==='presnap')){tu=Math.max(tu,cd.x+13);ty=12.5+(cd.y-12.5)*0.35;}
    if(bu!=null){tu=Math.max(tu,bu+16.5);ty=12.5+(by-12.5)*0.55;}
    tu=Math.min(tu,85);
  }
  const k=now?1:Math.min(1,dt*3);CAM.u+=(tu-CAM.u)*k;CAM.y+=(ty-CAM.y)*k;
}
function syncCam(dt,first){
  const bw=behindWanted(),dir=G.poss===0?1:-1;
  if(bw&&(!BEHIND||CAM.dir!==dir)){BEHIND=true;CAM.dir=dir;updateCam(0,true);}
  else{BEHIND=bw;if(BEHIND&&!first)updateCam(dt,false);}
}

function buildOffense(play){
  const L=G.los,k=L<7?Math.max(0.5,(L-1.5)/6):1,fx=d=>d<0?d*k:d,f=play.f;
  const qb=mk('off','QB',L+fx(f.Q[0]),f.Q[1],6.6,7),out=[qb];
  if(f.Q[2])qb.route=f.Q[2].map(([rd,rl])=>({x:L+fx(rd),y:clamp(rl,0.8,24.2)}));
  for(const id of ['C','X','Y','Z']){
    const [d,l,rt,cont]=f[id];
    const p=mk('off',id,L+fx(d),clamp(l,0.8,24.2),id==='C'?6.9:7.3,NUM[id]);p.btn=PB[id];
    p.route=rt.map(([rd,rl])=>({x:Math.min(59.4,L+fx(rd)),y:clamp(rl,0.8,24.2)}));
    if(cont!==0&&p.route.length){const e=p.route[p.route.length-1],pv=p.route.length>1?p.route[p.route.length-2]:{x:p.x,y:p.y};p.cont=norm(e.x-pv.x,e.y-pv.y);}
    out.push(p);
  }
  return out; // [QB,C,X,Y,Z]
}
function buildDefense(cov,off){
  const L=G.los, cx=v=>Math.min(v,59), so=off.slice(1).sort((a,b)=>a.y-b.y),rv=[so[0],so[3],so[1],so[2]];

  if(cov.id==='man'){at(0,2,rv[0].y+0.6);at(1,2,rv[1].y-0.6);at(2,3.5,rv[2].y);at(3,10,rv[3].y);}

  else if(cov.id==='c3'){at(0,7,4);at(1,7,21);at(2,5,8);at(3,13,12.5);at(4,5,17);}
  else if(cov.id==='c4'){at(0,9,3.5);at(1,9,21.5);at(2,9,15.5);at(3,9,9.5);}
  else if(cov.id==='blitz'){at(0,2,rv[0].y+0.6);at(1,2,rv[1].y-0.6);at(2,7,9);at(3,8,rv[2].y);D[4].y=16;}
  D.forEach((d,i)=>{d.rush=!!cov.r[i]; if(cov.m[i]!=null)d.man=rv[cov.m[i]]; if(cov.z[i]){const z=cov.z[i]; d.zone={x:Math.min(L+z.d*sq,58),y:z.y,R:z.R,deep:!!z.deep};}});
  return D;
}
const noRun=()=>G.isPAT||G.los>=45;
const playAllowed=i=>!(PLAYS[i].h&&noRun());
function cpuPickPlay(){const o=PLAYS.map((p,i)=>i).filter(playAllowed); return o[Math.floor(Math.random()*o.length)];}
function cpuPickCover(){const r=Math.random(); if((G.down>=3&&r<0.3)||r<0.1) return COVERS[4]; return COVERS[Math.floor(Math.random()*4)];}

/* ---------- flow ---------- */
function newGame(){G.score=[0,0];G.half=1;G.clock=240;G.startPoss=0;G.lastPlay=0;G.lastCov=0;G.screen='game';G.paused=false;FX.length=0;POPS.length=0;changePoss(0,5);}
function changePoss(t,los){G.poss=t;G.los=los;G.down=1;G.zone=los>=25?'goal':'mid';G.isPAT=false;banner('BALBEZIT '+teamOf(t).name,t===0?'Jij valt aan':'Jij verdedigt',teamOf(t).c,false,1.4);nextSnap();}
function nextSnap(){
  G.phase=G.poss===0?'playcall':'defcall';
  G.sel=G.poss===0?(playAllowed(G.lastPlay)?G.lastPlay:0):G.lastCov;
  OFF=buildOffense(PLAYS[0]); DEF=buildDefense(COVERS[0],OFF); G.sub='pre'; B={state:'pre'}; G.carrier=null; G.audible=false;
}
const nextSnapChk=()=>{if(G.clock<=0)endHalf();else nextSnap();};
const changePossChk=(t,l)=>{if(G.clock<=0)endHalf();else changePoss(t,l);};
const afterScore=t=>{G.isPAT=false;if(G.clock<=0)endHalf();else changePoss(t,5);};
function goPAT(){if(G.poss===0){G.phase='pat';G.sel=0;}else setPAT(Math.random()<0.35?2:1);}
function setPAT(p){G.isPAT=true;G.patPts=p;G.los=p===1?45:38;G.down=1;banner('EXTRA PUNT',p===1?'1 punt · vanaf 5 yard':'2 punten · vanaf 12 yard',C.lamp,false,1.3);nextSnap();}
function endHalf(){G.phase=G.half===1?'halftime':'final';G.banner=null;rumble(300,0.4,0.4);}
function startPresnap(play,cov){
  G.play=play;G.cover=cov;OFF=buildOffense(play);DEF=buildDefense(cov,OFF);
  G.handed=false;G.carrier=null;B={state:'pre'};G.sub='pre';G.phase='presnap';G.presnapT=1.6;G.charge=null;G.audible=false;
  if(G.poss===0)OFF[0].ctrl=true; else DEF[3].ctrl=true;
}
function snap(){G.phase='live';G.sub='snap';G.liveT=0;G.cpuThinkT=0;G.fwdUsed=false;G.qbTick=null;B={state:'snap',t:0};}
// na een handoff of een pass naar achteren mag de baldrager nog gooien, zolang hij achter de line of scrimmage staat
function passOpen(){const c=G.carrier;return !!c&&!G.fwdUsed&&G.sub==='run'&&B.state==='held'&&c.x<G.los;}
function passBtn(p){if(p===G.carrier)return null;if(p===OFF[0])return G.carrier?G.carrier.btn:null;return p.btn;}

function endPlay(r){
  if(G.phase!=='live')return;
  G.phase='dead';G.deadT=2;G.charge=null;
  if(B.state==='air')B.state='loose';
  const off=G.poss,def=1-off,tO=teamOf(off),tD=teamOf(def);
  let next=nextSnapChk,msg='',sub='',col=C.chalk,big=false,fd=false;
  if(['tackle','oob','sack'].includes(r.type)&&r.spot<=0&&!G.isPAT) r={type:'safety'};
  if(G.isPAT){
    if(r.type==='td'){G.score[off]+=G.patPts;msg=G.patPts>1?'2 PUNTEN RAAK':'EXTRA PUNT RAAK';sub=tO.name+' +'+G.patPts;col=tO.c;confetti(reduceMotion?20:60,[tO.c,tO.flag,'#ffffff']);rumble(260,0.5,0.6);}
    else {msg='EXTRA PUNT MISLUKT';sub=r.type==='int'?'Onderschept':'';}
    G.isPAT=false; next=()=>afterScore(def);
  } else {
    switch(r.type){
      case 'td':G.score[off]+=6;msg='TOUCHDOWN';sub=tO.name+' +6';col=tO.c;big=true;confetti(reduceMotion?40:160,[tO.c,tO.flag,'#ffffff']);rumble(500,1,1);next=goPAT;break;
      case 'safety':G.score[def]+=2;msg='SAFETY';sub=tD.name+' +2';col=tD.c;big=true;rumble(400,0.8,0.8);next=()=>afterScore(def);break;
      case 'int':{const s=clamp(50-r.spot,5,45);msg='INTERCEPTIE';sub=tD.name+' pakt de bal';col=tD.c;big=true;next=()=>changePossChk(def,s);}break;
      case 'inc':G.down++;msg=r.text||'INCOMPLEET';if(r.sub)sub=r.sub;break;
      default:{
        const spot=Math.min(r.spot,49.5),gain=spot-G.los;G.los=spot;
        if(G.zone==='mid'&&spot>=25){G.zone='goal';G.down=1;fd=true;msg='EERSTE DOWN';sub='Middenlijn gepasseerd';col=C.fd;}
        else{G.down++;const g=Math.round(gain);msg=r.type==='sack'?'SACK':(g>0?'+'+g+' YARD':g<0?g+' YARD':'GEEN WINST');sub=r.type==='oob'?'Buiten de lijnen':r.type==='sack'?g+' yard':'';}
      }
    }
    if((r.type==='inc'||['tackle','oob','sack'].includes(r.type))&&!fd&&G.down>4){msg='TURNOVER ON DOWNS';sub=tD.name+' krijgt de bal';col=tD.c;next=()=>changePossChk(def,5);}
    if(r.type!=='inc')G.clock=Math.max(0,G.clock-5);
  }
  banner(msg,sub,col,big);
  G.next=next;
}

/* ---------- movement ---------- */
function setVel(p,vx,vy,dt,acc){if(p.overrun>0)return;acc=acc||9;if(p.stun>0){vx=0;vy=0;acc=3;}const k=Math.min(1,acc*dt);p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;}
function steer(p,tx,ty,spd,dt,through){const dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy);if(d<0.05){setVel(p,0,0,dt);return;}const s=through?spd:Math.min(spd,d*3.5);setVel(p,dx/d*s,dy/d*s,dt);}
function pursue(d,t,dt,spd){spd=spd||d.spd*1.05;const k=clamp(dist(d,t)/7.5,0,0.9);steer(d,t.x+t.vx*k,t.y+t.vy*k,spd,dt,true);}
function integrate(p,dt){
  if(p.stun>0)p.stun-=dt;if(p.juke>0)p.juke-=dt;if(p.spin>0)p.spin-=dt;if(p.moveCd>0)p.moveCd-=dt;if(p.pullCd>0)p.pullCd-=dt;if(p.dive>0)p.dive-=dt;if(p.diveT>0)p.diveT-=dt;if(p.overrun>0)p.overrun-=dt;if(p.burst>0)p.burst-=dt;
  if(p.hesi>0){p.hesi-=dt;if(p.hesi<=0){p.burst=0.6;hesiFool(p);}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const k=Math.min(1,dt*4);p.sv.x+=(p.vx-p.sv.x)*k;p.sv.y+=(p.vy-p.sv.y)*k;
  if(p.spin>0)p.face+=dt*24;
  else if(hyp(p.vx,p.vy)>0.5){const a=Math.atan2(p.vy,p.vx);let da=a-p.face;da=Math.atan2(Math.sin(da),Math.cos(da));p.face+=da*Math.min(1,dt*10);}
  p.x=clamp(p.x,-9.6,59.6);
  p.y=p!==G.carrier?clamp(p.y,0.4,24.6):clamp(p.y,-1,26);
}
function userMove(p,dt){
  const m=Math.min(1,hyp(I.lx,I.ly));
  const sprint=I.held.R2&&p.stamina>0.03&&m>0.2;
  p.stamina=sprint?Math.max(0,p.stamina-dt*0.34):Math.min(1,p.stamina+dt*0.17);
  if(p.juke>0){setVel(p,p.jukeDir.x*9.5,p.jukeDir.y*9.5,dt,18);return;}
  if(p.dive>0){setVel(p,p.diveDir.x*9,p.diveDir.y*9,dt,18);return;}
  const spd=p.spd*(sprint?1.24:1)*(p.spin>0?0.85:1)*(p.burst>0?1.32:1)*(p.hesi>0?0.15:1);
  const v=stickW(I.lx,I.ly);setVel(p,v.x*spd,v.y*spd,dt,p.hesi>0||p.burst>0?16:10);
}
// verdediger die op de baldrager afkomt en dichtbij is
function closing(d,c){const dd=dist(d,c);if(dd<0.8||dd>3.2)return false;const ux=(c.x-d.x)/dd,uy=(c.y-d.y)/dd;return d.vx*ux+d.vy*uy>2;}
function hesiFool(p){
  if(p!==G.carrier)return;let n=0;
  for(const d of DEF){if(closing(d,p)&&Math.random()<0.65){d.overrun=0.45;n++;}}
  pop(p.x,p.y,n?'HESI!':'HESI',n?'#3fdcaa':C.dim);if(G.poss===0)rumble(80,0.2,0.3);
}
function doHesi(p){p.hesi=0.22;p.moveCd=1.1;}
function doJuke(p,rx,ry){
  let dir;
  if(hyp(rx,ry)>0.3)dir=norm(rx,ry);
  else{
    let nd=99,ne=null;for(const d of DEF){const v=dist(d,p);if(v<nd){nd=v;ne=d;}}
    const a={x:-p.vy,y:p.vx},b={x:p.vy,y:-p.vx};let pick=a;
    if(ne){const qx=ne.x-p.x,qy=ne.y-p.y;pick=(a.x*qx+a.y*qy)<(b.x*qx+b.y*qy)?a:b;}
    if(hyp(pick.x,pick.y)<0.1)pick={x:0,y:p.y<12.5?1:-1};
    dir=norm(pick.x,pick.y);
  }
  p.juke=0.24;p.jukeDir=dir;p.moveCd=1.0;
  // timing telt: werkt het best als een verdediger op 1-3 yard op je af komt
  let n=0;for(const d of DEF){const ok=closing(d,p);if(dist(d,p)<3.2&&Math.random()<(ok?0.78:0.2)){d.overrun=0.5;d.stun=Math.max(d.stun,0.2);n++;}}
  pop(p.x,p.y,n?'JUKE!':'JUKE',n?'#3fdcaa':C.dim); if(G.poss===0)rumble(70,0,0.35);
}
function doSpin(p){p.spin=0.42;p.moveCd=1.2;
  let n=0;for(const d of DEF){if(dist(d,p)<1.6&&closing(d,p)&&Math.random()<0.5){d.overrun=0.4;n++;}}
  pop(p.x,p.y,n?'SPIN!':'SPIN',n?'#3fdcaa':C.dim);if(G.poss===0)rumble(90,0.2,0.2);}
function carrierMoves(p){
  if(p.moveCd>0)return;
  if(I.rflick){const v=stickW(I.rflick.x,I.rflick.y);doJuke(p,v.x,v.y);}
  else if(I.pressed.SQ){const v=stickW(I.rx,I.ry);doJuke(p,v.x,v.y);}
  else if(I.pressed.O)doSpin(p);
  else if(I.pressed.TRI)doHesi(p);
}

/* ---------- passing ---------- */
function throwTo(qb,rec,bullet){
  const spd=bullet?21:14.5;let ax=rec.x,ay=rec.y,T=0.3;
  for(let i=0;i<4;i++){const d=hyp(ax-qb.x,ay-qb.y);T=d/spd+(bullet?0.04:0.22);ax=rec.x+rec.vx*T;ay=rec.y+rec.vy*T;}
  const d=hyp(ax-qb.x,ay-qb.y);
  let pres=0;for(const r of DEF)if(r.rush)pres=Math.max(pres,clamp((3.2-dist(r,qb))/3.2,0,1));
  const mov=Math.min(1,hyp(qb.vx,qb.vy)/qb.spd);
  const sd=0.18+d*0.02*(bullet&&d>14?1.4:1)*(!bullet&&d<8?1.3:1)+pres*0.75+mov*0.3;
  ax+=gauss()*sd;ay+=gauss()*sd;
  const h=bullet?Math.min(1.6,0.4+d*0.04):Math.max(1.8,d*0.2);
  B={state:'air',x0:qb.x,y0:qb.y,x1:ax,y1:ay,t:0,T,lob:!bullet,target:rec,h};
  if(ax>qb.x)G.fwdUsed=true;
  G.carrier=null;G.sub='air';rumble(60,0,0.25);
}
function throwAway(qb){G.fwdUsed=true;B={state:'air',x0:qb.x,y0:qb.y,x1:G.los+4,y1:qb.y<12.5?-3:28,t:0,T:0.9,lob:true,target:null,h:3,away:true};G.carrier=null;G.sub='air';}
function resolvePass(){
  const Lx=B.x1,Ly=B.y1;B.state='loose';
  if(B.away||Ly<-0.3||Ly>25.3||Lx>59.8){endPlay({type:'inc',text:B.away?'WEGGEGOOID':'INCOMPLEET'});return;}
  const rec=B.target,dR=rec?hyp(rec.x-Lx,rec.y-Ly):99;
  let bd=null,dD=99;for(const d of DEF){if(d.stun>0)continue;const v=hyp(d.x-Lx,d.y-Ly);if(v<dD){dD=v;bd=d;}}
  if(bd&&dD<1.45){
    let pI=(B.lob?0.34:0.2)*(1.45-dD)/1.45*(dD<dR?1.5:0.55);
    if(bd.ctrl)pI=bd.diveT>0?pI+0.45:pI*0.4;
    if(Math.random()<pI){pop(bd.x,bd.y,'PICK!',C.lamp);rumble(350,0.8,0.8);endPlay({type:'int',spot:bd.x});return;}
  }
  if(rec&&dR<1.55){
    let pC=0.94-(dR>1.05?0.2:0)-(dD<1.7?(1.7-dD)/1.7*0.42:0);
    if(bd&&bd.ctrl&&bd.diveT>0&&dD<1.7)pC-=0.2;
    if(Math.random()<pC){
      G.carrier=rec;B.state='held';G.sub='run';
      if(G.poss===0){OFF.forEach(p=>p.ctrl=false);rec.ctrl=true;}
      pop(rec.x,rec.y,'VANGST',C.chalk);rumble(80,0.1,0.3);return;
    }
    endPlay({type:'inc',text:dD<1.7?'PASS VERDEDIGD':'LATEN VALLEN'});return;
  }
  endPlay({type:'inc',text:'INCOMPLEET'});
}
function attempt(d,c,user){
  let p=user?0.8:0.56;
  if(c.spin>0)p-=user?0.38:0.45; if(c.juke>0)p-=0.3;
  if(c===OFF[0]&&G.sub==='pocket')p=user?0.85:0.62;
  if(d.x<c.x-0.3)p+=0.1;
  if(Math.random()<p){
    c.flagged=true;flagFly(c,teamOf(G.poss).flag);rumble(220,0.6,0.5);pop(c.x,c.y,'FLAG!',C.chalk);
    endPlay(c===OFF[0]&&G.sub==='pocket'?{type:'sack',spot:c.x}:{type:'tackle',spot:c.x});
  } else {d.pullCd=0.7;d.stun=Math.max(d.stun,user?0.4:0.3);pop(d.x,d.y,'MIS',C.dim);}
}

/* ---------- AI ---------- */
function runRoute(p,dt){
  if(G.sub==='snap'&&G.liveT<0.12){setVel(p,0,0,dt);return;}
  if(B.state==='air'&&B.target===p&&p.ctrl&&G.poss===0&&hyp(I.lx,I.ly)>0.2){userMove(p,dt);return;}
  if(B.state==='air'&&B.target===p&&B.T-B.t<1.6){const dd=hyp(B.x1-p.x,B.y1-p.y);if(dd<(B.T-B.t)*p.spd*1.1+1.6){steer(p,B.x1,B.y1,p.spd*1.05,dt,false);return;}}
  if(p.route&&p.ri<p.route.length){const w=p.route[p.ri];steer(p,w.x,w.y,p.spd,dt,true);if(hyp(w.x-p.x,w.y-p.y)<0.7)p.ri++;return;}
  if(p.cont){setVel(p,p.cont.x*p.spd,p.cont.y*p.spd,dt,6);return;}
  setVel(p,0,0,dt,6);
}
// QB loopt eerst zijn getekende drop/rollout, zolang de speler de stick niet gebruikt
function qbDrop(qb,dt){
  if(!qb.route||qb.ri>=qb.route.length)return false;
  if(hyp(I.lx,I.ly)>=0.2&&G.poss===0){qb.ri=qb.route.length;return false;}
  const w=qb.route[qb.ri];steer(qb,w.x,w.y,qb.spd*0.85,dt,false);if(hyp(w.x-qb.x,w.y-qb.y)<0.4)qb.ri++;return true;
}
function cpuQB(qb,dt){
  let near=null,nd=99;for(const d of DEF)if(d.rush){const v=dist(d,qb);if(v<nd){nd=v;near=d;}}
  if(qbDrop(qb,dt)){}
  else if(near&&nd<4){const v=norm(qb.x-near.x,qb.y-near.y);setVel(qb,v.x*qb.spd*0.9,v.y*qb.spd*0.9,dt,7);}else setVel(qb,0,0,dt,5);
  if(qb.y<1.5)qb.vy=Math.abs(qb.vy);if(qb.y>23.5)qb.vy=-Math.abs(qb.vy);
  if(G.play.h&&!G.handed&&G.liveT<1.5)return;
  G.cpuThinkT-=dt;if(G.liveT<0.85||G.cpuThinkT>0)return;G.cpuThinkT=0.2;
  const need=(G.zone==='mid'?25:50)-G.los;let best=null,bv=-1e9,bs=0;
  for(const r of OFF){if(r===qb)continue;let sep=99;for(const d of DEF){if(d.rush)continue;sep=Math.min(sep,dist(d,r));}
    const depth=r.x-G.los;const v=Math.min(sep,5)*1.2+clamp(depth,-3,need+3)*0.12+(depth>=need?0.8:0)-(dist(r,qb)>28?3:0);
    if(v>bv){bv=v;best=r;bs=sep;}}
  if(!best)return;
  if(bs>2.7||(G.liveT>2.3&&bs>1.6)||nd<1.9||G.liveT>4.2){
    if(nd<1.3&&bs<1.2&&Math.random()<0.5)throwAway(qb);else throwTo(qb,best,dist(qb,best)<13);
  }
}
function cpuCarrier(c,dt){
  if(c.juke>0){setVel(c,c.jukeDir.x*9.5,c.jukeDir.y*9.5,dt,18);return;}
  let dx=1,dy=0,nearD=99;
  for(const d of DEF){const rx=c.x-d.x,ry=c.y-d.y,dd=hyp(rx,ry);if(dd<nearD)nearD=dd;
    if(dd<6&&d.x>c.x-1.5){const w=(6-dd)/6;dy+=(ry>=0?1:-1)*w*1.7;dx-=w*0.35;}}
  if(c.y<2.5)dy+=0.9;if(c.y>22.5)dy-=0.9;
  const v=norm(Math.max(0.15,dx),dy),m=(c.burst>0?1.32:1)*(c.hesi>0?0.15:1);
  setVel(c,v.x*c.spd*1.08*m,v.y*c.spd*1.08*m,dt,c.hesi>0||c.burst>0?16:8);
  if(nearD<2.4&&c.moveCd<=0&&Math.random()<dt*2.2){const r=Math.random();if(r<0.5)doJuke(c,0,0);else if(r<0.75)doSpin(c);else doHesi(c);}
}
function aiDef(d,dt){
  if(G.sub==='snap'&&G.liveT<0.18){setVel(d,0,0,dt,6);return;}
  const c=G.carrier;
  // bij een mogelijke pass van achter de lijn blijven verdedigers verder weg nog even in hun dekking
  if(G.sub==='run'&&c&&!(passOpen()&&!d.rush&&dist(d,c)>5)){pursue(d,c,dt);return;}
  if(G.sub==='air'&&B.t>0.28&&!B.away&&hyp(d.x-B.x1,d.y-B.y1)<6.5){steer(d,B.x1,B.y1,d.spd*1.02,dt,true);return;}
  if(d.rush){if(G.sub==='air'){setVel(d,d.vx*0.5,d.vy*0.5,dt,3);return;}pursue(d,OFF[0],dt,Math.min(d.spd,5.9));return;}
  if(d.man){const r=d.man,cush=0.25+clamp(r.sv.x/7,0,1);steer(d,r.x+r.sv.x*0.35+cush,r.y+r.sv.y*0.3,d.spd,dt,false);return;}
  if(d.zone){
    const z=d.zone;
    // eerst de zone-drop: naar het midden van de eigen zone, ongeacht ontvangers
    if(G.liveT<0.7){steer(d,z.x,z.y,d.spd*0.9,dt,false);return;}
    let best=null,bd=1e9;
    for(const r of OFF){if(r===OFF[0])continue;const v=hyp(r.x-z.x,r.y-z.y);if(v<z.R&&(!z.deep||r.x>G.los+5)&&(z.deep?r.x>(best?best.x:-99):v<bd)){bd=v;best=r;}}
    if(best){
      // tussen zone-midden en de ontvanger in blijven; diep altijd boven de diepste man
      const w=z.deep?0.55:0.6;let tx=lerp(z.x,best.x+best.sv.x*0.3,w),ty=lerp(z.y,best.y+best.sv.y*0.3,w);
      if(z.deep)tx=Math.max(tx,best.x+1.8);
      steer(d,tx,ty,d.spd*0.95,dt,false);
    } else steer(d,z.x,z.y,d.spd*0.8,dt,false);
    return;
  }
  setVel(d,0,0,dt);
}
function userDef(d,dt){
  userMove(d,dt);
  if(I.pressed.X){const c=G.carrier;if(c&&G.sub!=='snap'&&dist(d,c)<1.45)attempt(d,c,true);else d.stun=Math.max(d.stun,0.12);}
  if(I.pressed.TRI){d.diveT=0.6;if(B.state==='air'&&hyp(B.x1-d.x,B.y1-d.y)<5){d.dive=0.28;d.diveDir=norm(B.x1-d.x,B.y1-d.y);}}
  if(I.pressed.L1)switchDef();
}
function switchDef(){
  const t=G.carrier||(B.state==='air'?{x:B.x1,y:B.y1}:OFF[0]);
  const cur=DEF.find(d=>d.ctrl);
  const sorted=[...DEF].sort((a,b)=>dist(a,t)-dist(b,t));
  let pick=sorted[0];if(pick===cur&&sorted[1])pick=sorted[1];
  DEF.forEach(d=>d.ctrl=false);pick.ctrl=true;rumble(40,0,0.2);
}

/* ---------- live play ---------- */
function updateLive(dt){
  G.liveT+=dt;if(!G.isPAT)G.clock=Math.max(0,G.clock-dt);
  const qb=OFF[0],userOff=G.poss===0;
  if(B.state==='snap'){B.t+=dt;if(B.t>=0.22){B.state='held';G.carrier=qb;G.sub='pocket';}}
  if(G.play.h&&!G.handed&&G.sub==='pocket'&&G.carrier===qb){const rb=OFF.find(p=>p.role===G.play.h);
    if(dist(rb,qb)<1.35&&G.liveT>0.3){G.carrier=rb;G.handed=true;G.sub='run';if(userOff){qb.ctrl=false;rb.ctrl=true;}pop(rb.x,rb.y,'HANDOFF',C.chalk);}}
  for(const p of OFF){
    if(p===G.carrier){
      if(userOff){if(p===qb&&G.sub==='pocket'&&qbDrop(p,dt)&&hyp(I.lx,I.ly)<0.2){}else userMove(p,dt);
        if(G.sub==='pocket'&&p===qb)userThrow(qb,dt);
        else if(passOpen()){userThrow(p,dt);if(G.carrier===p&&p.moveCd<=0&&I.rflick){const v=stickW(I.rflick.x,I.rflick.y);doJuke(p,v.x,v.y);}}
        else carrierMoves(p);}
      else{if(G.sub==='pocket'&&p===qb)cpuQB(qb,dt);else cpuCarrier(p,dt);}
    } else if(G.sub==='run'&&!passOpen())setVel(p,p.vx*0.4,p.vy*0.4,dt,2);
    else if(G.sub==='run'&&p===qb)setVel(p,0,0,dt,5);
    else if(p===qb)setVel(p,0,0,dt,5);
    else runRoute(p,dt);
    if(G.phase!=='live')return;
  }
  for(const d of DEF){if(d.ctrl)userDef(d,dt);else aiDef(d,dt);if(G.phase!=='live')return;}
  for(const p of OFF)integrate(p,dt);
  for(const d of DEF){integrate(d,dt);if(!d.rush&&(G.sub==='snap'||G.sub==='pocket')&&d.x<G.los+0.3)d.x=G.los+0.3;}
  const c=G.carrier;
  if(c&&c===qb&&G.sub==='pocket'&&c.x>G.los-0.2){c.x=G.los-0.2;if(c.vx>0)c.vx=0;}
  if(B.state==='air'){B.t+=dt;if(B.t>=B.T){resolvePass();return;}}
  // 7-secondenklok voor de QB: vanaf 3 aftellen, op 0 is de bal dood (verlies van een down)
  if(c&&c===qb&&G.sub==='pocket'){
    const left=7-G.liveT,sec=Math.ceil(left);
    if(left<=3&&sec>0&&sec!==G.qbTick){G.qbTick=sec;rumble(70,0,sec===1?0.6:0.3);}
    if(left<=0){pop(qb.x,qb.y,'TIJD!',C.red);endPlay({type:'inc',text:'7 SECONDEN',sub:'Bal te lang vastgehouden · verlies van een down'});return;}
  }
  if(c){
    if(c.y<0||c.y>25){pop(c.x,clamp(c.y,0,25),'UIT',C.dim);endPlay({type:'oob',spot:c.x});return;}
    if(c.x>=50&&G.sub==='run'){endPlay({type:'td'});return;}
    for(const d of DEF){if(d.ctrl||d.stun>0||d.pullCd>0||d.overrun>0)continue;if(dist(d,c)<0.95){attempt(d,c,false);if(G.phase!=='live')return;}}
  }
}
function userThrow(qb,dt){
  if(B.state!=='held')return;
  if(!G.charge){
    for(const b of ['X','O','SQ','TRI'])if(I.pressed[b]&&OFF.some(p=>passBtn(p)===b)){G.charge={b,t:0};break;}
    if(!G.charge&&I.pressed.R1){throwAway(qb);return;}
  }
  if(G.charge){G.charge.t+=dt;const b=G.charge.b;
    if(!I.held[b]||G.charge.t>=0.5){const rec=OFF.find(p=>passBtn(p)===b);const bullet=G.charge.t>=0.18;G.charge=null;if(rec){throwTo(qb,rec,bullet);OFF.forEach(p=>p.ctrl=false);rec.ctrl=true;}}}
}

  for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt;f.r+=f.vr*dt;f.life-=dt;if(f.life<=0)FX.splice(i,1);}

/* ---------- update ---------- */
function update(dt){
  G.time+=dt;pollInput(dt);
  syncCam(dt,true);
  if(G.toast){G.toast.t+=dt;if(G.toast.t>2.6)G.toast=null;}
  if(G.screen==='title'){if(I.pressed.X){G.screen='teams';G.teamRow=0;}return;}
  if(G.screen==='teams'){
    if(I.navY)G.teamRow=clamp(G.teamRow+I.navY,0,1);
    if(I.navX){const r=G.teamRow;let v=G.teamSel[r];do{v=(v+I.navX+TEAMS.length)%TEAMS.length;}while(v===G.teamSel[1-r]);G.teamSel[r]=v;}
    if(I.pressed.X)G.screen='tutorial';else if(I.pressed.O)G.screen='title';
    return;
  }
  if(G.screen==='tutorial'){if(I.pressed.X)newGame();else if(I.pressed.O)G.screen='teams';return;}
  if(I.pressed.OPT&&G.phase!=='halftime'&&G.phase!=='final'){
    if(G.paused)G.paused=false;else{G.paused=true;G.pauseReason='';G.pauseView='menu';G.pauseSel=0;}
    return;
  }
  if(G.paused){
    if(G.pauseView==='controls'){if(I.pressed.O||I.pressed.X)G.pauseView='menu';return;}
    if(I.navY)G.pauseSel=(G.pauseSel+I.navY+4)%4;
    if(I.pressed.O)G.paused=false;
    else if(I.pressed.X){if(G.pauseSel===0)G.paused=false;else if(G.pauseSel===1)toggleCam();else if(G.pauseSel===2)G.pauseView='controls';else{G.paused=false;G.screen='title';}}
    return;
  }
  if(I.pressed.R3)toggleCam();
  updateFX(dt);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  switch(G.phase){
    case 'playcall':
      if(I.navX)G.sel=Math.floor(G.sel/3)*3+((G.sel%3)+I.navX+3)%3;
      if(I.navY)G.sel=(G.sel+3*I.navY+PLAYS.length)%PLAYS.length;
      if(I.pressed.R1)G.sel=(G.sel+6)%PLAYS.length;
      if(I.pressed.L1)G.sel=(G.sel-6+PLAYS.length)%PLAYS.length;
      if(I.pressed.X){if(playAllowed(G.sel)){G.lastPlay=G.sel;startPresnap(PLAYS[G.sel],cpuPickCover());}else banner('GEEN RUN','In een no-run zone mag je alleen passen',C.red,false,1.4);}
      break;
    case 'defcall':
      if(I.navX)G.sel=(G.sel+I.navX+COVERS.length)%COVERS.length;
      if(I.pressed.X){G.lastCov=G.sel;startPresnap(PLAYS[cpuPickPlay()],COVERS[G.sel]);}
      break;
    case 'pat':
      if(I.navX)G.sel=(G.sel+I.navX+2)%2;
      if(I.pressed.X)setPAT(G.sel+1);
      break;
    case 'presnap':
      if(G.poss===0){
        if(G.audible){const pick=I.pressed.SQ?0:I.pressed.X?1:I.pressed.O?2:-1;
          if(pick>=0){G.lastPlay=AUD[pick];startPresnap(PLAYS[AUD[pick]],G.cover);pop(OFF[0].x,OFF[0].y,'AUDIBLE',C.lamp);}
          else if(I.pressed.TRI)G.audible=false;}
        else if(I.pressed.X)snap();else if(I.pressed.TRI)G.audible=true;
      } else {if(I.pressed.L1)switchDef();G.presnapT-=dt;if(G.presnapT<=0)snap();}
      break;
    case 'live':updateLive(dt);break;
    case 'dead':
      G.deadT-=dt;
      if(G.deadT<=0||(G.deadT<1.5&&I.pressed.X)){const n=G.next;G.next=null;if(n)n();}
      break;
    case 'halftime':
      if(I.pressed.X){G.half=2;G.clock=240;changePoss(1-G.startPoss,5);}
      break;
    case 'final':
      if(I.pressed.X)G.screen='teams';
      break;
  }
  syncCam(dt,false);
}
function toggleCam(){
  if(G.poss===0){G.camOff=G.camOff==='achter'?'boven':'achter';toast(G.camOff==='achter'?'Camera aanval: achter de offense':'Camera aanval: van boven');}
  else{G.camDef=G.camDef==='achter'?'boven':'achter';toast(G.camDef==='achter'?'Camera verdediging: achter de defense':'Camera verdediging: van boven');}
}

 ['VOOR DE SNAP',[[['X'],'Snap'],[['TRI'],'Audible: 3 snelkeuzes'],[['R3'],'Camera: achter je team of van boven'],[['OPT'],'Pauze']]],

/* ---------- screens ---------- */
function drawTitle(){
  drawField(teamOf(0),teamOf(1),0.3);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(8,16,12,.55)');g.addColorStop(0.6,'rgba(8,16,12,.85)');g.addColorStop(1,'rgba(8,16,12,.97)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ls('10px');txt('FLAG RUSH',800,330,'italic 800 200px '+FD,C.chalk,'center','middle');ls('0px');
  ctx.fillStyle=C.lamp;ctx.fillRect(560,430,480,5);
  ls('6px');txt('5 TEGEN 5 FLAG FOOTBALL  ·  IFAF-REGELS',800,480,'600 26px '+FD,C.dim,'center','middle');ls('0px');
  const on=I.connected,id=(I.padId||'').replace(/\(.*?\)/g,'').trim().slice(0,38);
  ctx.font='700 18px '+FD;const label=on?'CONTROLLER VERBONDEN'+(id?' · '+id.toUpperCase():''):I.blocked?'CONTROLLER GEBLOKKEERD IN DEZE WEERGAVE':'GEEN CONTROLLER GEVONDEN';ls('2px');const pw=ctx.measureText(label).width+60;ls('0px');
  rr(800-pw/2,560,pw,40,20);ctx.fillStyle='rgba(16,22,19,.9)';ctx.fill();ctx.strokeStyle=on?'#3fdcaa':C.rim;ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(800-pw/2+24,580,6,0,Math.PI*2);ctx.fillStyle=on?'#3fdcaa':'#5b6670';ctx.fill();ls('2px');txt(label,800-pw/2+40,581,'700 18px '+FD,on?C.chalk:C.dim,'left','middle');ls('0px');
  const a=reduceMotion?1:0.55+0.45*Math.sin(G.time*3.2);ctx.save();ctx.globalAlpha=a;
  if(on){glyph('X',690,660,20);txt('Druk op ✕ om te beginnen',720,662,'600 30px '+FB,C.chalk,'left','middle');}
  else if(I.blocked)txt('Download flag-rush.html en open het bestand in Chrome of Edge',800,662,'600 28px '+FB,C.chalk,'center','middle');
  else txt('Druk op een knop op je PlayStation-controller om te koppelen',800,662,'600 28px '+FB,C.chalk,'center','middle');
  ctx.restore();
  txt(on?'':I.blocked?'Deze browserweergave laat geen controllers toe. Met Spatie speel je hier met het toetsenbord.':'Geen controller? Druk op Spatie om met het toetsenbord te spelen.',800,710,'500 19px '+FB,C.dim,'center','middle');
  txt('Werkt het best in Chrome of Edge · F = volledig scherm',800,850,'500 16px '+FB,'#5f6b65','center','middle');
}
function drawTeams(){
  drawField(teamOf(0),teamOf(1),0.25);ctx.fillStyle='rgba(8,16,12,.85)';ctx.fillRect(0,0,W,H);
  ls('4px');txt('KIES JE TEAMS',800,170,'italic 800 56px '+FD,C.chalk,'center','middle');ls('0px');

    ctx.fillStyle=t.flag;ctx.fillRect(1060,y+42,14,46);ctx.fillRect(1084,y+42,14,46);txt('FLAGS',1079,y+106,'700 13px '+FD,t.ink,'center','middle');
    ctx.fillStyle=s?C.lamp:'rgba(255,255,255,.25)';for(const [ax,d] of [[395,-1],[1205,1]]){ctx.beginPath();ctx.moveTo(ax+d*10,y+65);ctx.lineTo(ax-d*6,y+52);ctx.lineTo(ax-d*6,y+78);ctx.closePath();ctx.fill();}
  });
  drawHintRow([[['DP'],'Rij en team kiezen'],[['X'],'Verder'],[['O'],'Terug']],780);

function drawGame(){
  const oT=teamOf(G.poss),dT=teamOf(1-G.poss);
  if(BEHIND)drawFieldBehind(oT,dT);else drawField(oT,dT,1);
  drawLines();
  if(G.poss===0&&G.phase==='presnap')drawRoutes();
  drawCoverage();
  const all=[...OFF.map(p=>[p,oT]),...DEF.map(p=>[p,dT])];
  if(BEHIND){all.sort((a,b)=>(b[0].x-a[0].x)*CAM.dir);for(const [p,t] of all)drawPlayer3D(p,t);}
  else{all.sort((a,b)=>a[0].y-b[0].y);for(const [p,t] of all)drawPlayer(p,t);}
  drawBall();
  if(G.phase==='live'&&G.sub==='pocket'&&G.carrier===OFF[0]&&G.liveT>=4){
    const sec=Math.max(1,Math.ceil(7-G.liveT)),hp=headPos(OFF[0]);
    if(hp){const f=1-((7-G.liveT)%1);ctx.save();ctx.translate(hp.x,hp.y-(BEHIND?28:22));ctx.scale(1+f*0.25,1+f*0.25);ctx.lineWidth=7;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.font='italic 800 54px '+FD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(String(sec),0,0);ctx.fillStyle=sec===1?C.red:C.lamp;ctx.fillText(String(sec),0,0);ctx.restore();}
  }
  if(G.poss===0&&(G.phase==='presnap'||(G.phase==='live'&&((G.sub==='pocket'&&G.carrier===OFF[0])||passOpen())))){
    for(const p of OFF){const pb=G.phase==='presnap'?p.btn:passBtn(p);if(!pb)continue;const hp=headPos(p);if(!hp)continue;const x=hp.x,y=hp.y;glyph(pb,x,y,13);
      if(G.charge&&G.charge.b===pb){const f=Math.min(1,G.charge.t/0.5);ctx.strokeStyle=G.charge.t>=0.18?C.lamp:C.chalk;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,18,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.stroke();
        if(G.charge.t>=0.18){ls('2px');txt('BULLET',x,y-26,'700 13px '+FD,C.lamp,'center','middle');ls('0px');}}}
  }
  drawFX();
  if(BEHIND){const gr=ctx.createLinearGradient(0,720,0,H);gr.addColorStop(0,'rgba(8,16,12,0)');gr.addColorStop(1,'rgba(8,16,12,.92)');ctx.fillStyle=gr;ctx.fillRect(0,720,W,H-720);}
  drawHUD();drawStatus();drawBanner();
  if(G.phase==='playcall')drawPlaycall();
  else if(G.phase==='defcall')drawDefcall();
  else if(G.phase==='pat')drawPAT();
  else if(G.phase==='halftime')drawCenterCard('RUST',['Tweede helft: '+teamOf(1-G.startPoss).name+' begint aan de bal']);
  else if(G.phase==='final'){const d=G.score[0]-G.score[1];drawCenterCard(d>0?'GEWONNEN':d<0?'VERLOREN':'GELIJKSPEL',['Eindstand na 2 × 4 minuten'],d>0?C.lamp:d<0?C.red:C.chalk);}
  if(G.phase==='presnap'&&G.audible)drawAudible();
  // hints
  let h=[];const userOff=G.poss===0;
  if(G.phase==='playcall')h=[[['DP'],'Kies play'],[['L1','R1'],'Vorige / volgende pagina'],[['X'],'Bevestig'],[['OPT'],'Pauze']];
  else if(G.phase==='defcall')h=[[['DP'],'Kies dekking'],[['X'],'Bevestig'],[['OPT'],'Pauze']];
  else if(G.phase==='pat')h=[[['DP'],'Kies'],[['X'],'Bevestig']];
  else if(G.phase==='presnap')h=userOff?(G.audible?[[['SQ','X','O'],'Kies play'],[['TRI'],'Annuleer']]:[[['X'],'Snap'],[['TRI'],'Audible'],[['R3'],'Camera'],[['OPT'],'Pauze']]):[[['L1'],'Wissel speler'],[['R3'],'Camera'],[[],'Tegenstander snapt de bal…']];
  else if(G.phase==='live'){
    if(userOff){if(passOpen())h=[[['X','O','SQ','TRI'],'Gooi, kan nog achter de lijn'],[['LS'],'Lopen'],[['RS'],'Juke'],[['R2'],'Sprint']];
      else if(G.sub==='pocket'||G.sub==='snap')h=[[['X','O','SQ','TRI'],'Gooi · tik = lob, vast = bullet'],[['R1'],'Weggooien'],[['LS'],'Bewegen']];
      else if(G.sub==='air')h=[[['LS'],'Stuur je ontvanger naar de bal (of laat los: automatisch)']];
      else h=[[['LS'],'Lopen'],[['R2'],'Sprint'],[['RS','SQ'],'Juke'],[['O'],'Spin'],[['TRI'],'Hesitation']];}
    else h=[[['LS'],'Bewegen'],[['R2'],'Sprint'],[['X'],'Flag grijpen'],[['TRI'],'Onderscheppen'],[['L1'],'Wissel']];
  }
  else if(G.phase==='dead')h=[[['X'],'Verder']];
  else if(G.phase==='halftime')h=[[['X'],'Tweede helft']];
  else if(G.phase==='final')h=[[['X'],'Nieuwe wedstrijd']];
  if(h.length)drawHintRow(h,G.phase==='defcall'?800:776);
  if(G.phase==='presnap'||G.phase==='live'){ls('2px');txt(userOff?'JOUW PLAY  ·  '+G.play.name:'JOUW DEKKING  ·  '+G.cover.name,60,850,'700 16px '+FD,C.dim,'left','middle');ls('0px');}
  if(I.mode!=='pad'&&G.phase!=='playcall'&&G.phase!=='defcall')txt('Spatie ✕ · 2 ◯ · 3 □ · 4 △ · 5 R1 · Shift R2 · Tab L1 · C camera · P pauze',1540,850,'500 15px '+FB,'#5f6b65','right','middle');
  if(G.paused){if(G.pauseView==='controls'){drawControls(false);drawHintRow([[['O'],'Terug']],820);}else{drawPause();drawHintRow([[['DP'],'Kies'],[['X'],'Bevestig'],[['O'],'Doorgaan']],820);}}
}
function draw(){
  const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle=C.night;ctx.fillRect(0,0,W,H);
  if(G.screen==='title'){drawTitle();drawStatus();}
  else if(G.screen==='teams'){drawTeams();drawStatus();}
  else if(G.screen==='tutorial'){drawField(teamOf(0),teamOf(1),0.3);drawControls(true);drawHintRow([[['X'],'Aftrap'],[['O'],'Terug']],820);drawStatus();}
  else drawGame();
}

let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  try{update(dt);draw();}catch(e){console.error(e);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('800 40px "Saira Condensed"').catch(()=>{});document.fonts.load('600 20px "Barlow"').catch(()=>{});}
cv.focus();
})();
